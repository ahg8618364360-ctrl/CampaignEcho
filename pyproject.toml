[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "campaignecho"
version = "0.1.0"
description = "CampaignEcho — Memory-Powered AI Marketing Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"

