[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campaignecho"
version = "0.1.0"
description = "CampaignEcho — Memory-Powered AI Marketing Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0.0",
    "hindsight-client>=1.2.0",
    "aiohttp>=3.9.0",
    "aiohttp-retry>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["frontend*", "scratch*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient.*:Warning",
]
markers = [
    "integration: live integration tests requiring real external service connectivity and credentials",
    "unit: isolated fast unit tests using local database and mocks",
]
